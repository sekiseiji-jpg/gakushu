<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a6a1f">
<meta name="description" content="日本人のノーベル賞受賞者（物理学賞・化学賞・生理学医学賞）28人の一覧。受賞年・業績・歩みを一人ずつまとめています。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本人のノーベル賞">
<title>日本人のノーベル賞</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header class="bar">
  <button id="btn-back" class="icon-btn" title="もどる" aria-label="もどる">◀</button>
  <div class="bar-title"><span class="logo">🏅</span><h1 id="bar-title">日本人のノーベル賞</h1></div>
  <button id="btn-set" class="icon-btn" title="設定" aria-label="設定">⚙</button>
</header>

<main class="wrap">

  <!-- 作品一覧 -->
  <section id="view-works" class="view hidden">
    <p class="lead" id="works-lead"></p>
    <div id="work-list" class="grid"></div>
  </section>

  <!-- 作品の扉 -->
  <!-- 作家一覧 -->
  <section id="view-authors" class="view hidden">
    <p class="lead" id="authors-lead"></p>
    <div id="author-list" class="pgrid"></div>
    <div class="note">
      <b>このアプリについて</b>
      <ul>
        <li>ノーベル賞の理化学分野（物理学賞・化学賞・生理学医学賞）の日本人受賞者を、受賞年の順に並べています。</li>
        <li>名前を選ぶと、受賞理由・歩み・人物像・そのほかの業績を読めます。</li>
        <li>受賞者の顔写真は、著作権の保護期間が満了したものがほとんど無いため載せていません。</li>
        <li>通信がなくても開けます。文字の大きさや配色は設定（⚙）で変えられます。</li>
      </ul>
    </div>
  </section>

  <!-- 作家のページ -->
  <section id="view-author" class="view hidden">
    <div class="hero ahero" id="author-hero"></div>
    <div id="author-body"></div>
  </section>

  <section id="view-work" class="view hidden">
    <div class="hero" id="work-hero"></div>
    <div class="tabs" id="work-tabs">
      <button class="tab on" data-wtab="maki">巻一覧</button>
      <button class="tab" data-wtab="about">この作品について</button>
      <button class="tab" data-wtab="source">本文の出どころ</button>
    </div>
    <div id="work-maki" class="wpane"></div>
    <div id="work-about" class="wpane hidden"></div>
    <div id="work-source" class="wpane hidden"></div>
  </section>

  <!-- 巻 -->
  <section id="view-maki" class="view hidden">
    <div class="maki-head" id="maki-head"></div>
    <div class="summary" id="maki-summary"></div>
    <div class="notes" id="maki-notes" hidden></div>
    <div class="switch" id="maki-switch">
      <button class="sw on" data-text="yaku">現代語訳</button>
      <button class="sw" data-text="genbun">原文</button>
      <button class="sw" data-text="taisho">対照</button>
      <span class="sw-note" id="sw-note"></span>
    </div>
    <article id="maki-body" class="body"></article>
    <nav class="pager" id="maki-pager"></nav>
  </section>

</main>

<!-- 設定 -->
<div id="setwrap" class="modal hidden">
  <div class="sheet">
    <h2>設定</h2>
    <label class="row"><span>文字サイズ</span>
      <select id="set-size"><option value="s">小</option><option value="m">中</option><option value="l">大</option><option value="xl">特大</option></select>
    </label>
    <label class="row"><span>配色</span>
      <select id="set-theme"><option value="auto">端末に合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option><option value="sepia">セピア</option></select>
    </label>
    <label class="row"><span>行間</span>
      <select id="set-lh"><option value="n">ふつう</option><option value="w">ひろめ</option></select>
    </label>

    <div class="sect">
      <h3>オフラインで読む</h3>
      <div id="dl-list"></div>
      <p class="hint" id="dl-hint"></p>
    </div>

    <div class="sect">
      <h3>読書記録</h3>
      <div class="row rowbtn">
        <span id="read-hint">読んだ巻</span>
        <button id="btn-clear" class="mini">消す</button>
      </div>
    </div>
    <button id="btn-close" class="close">閉じる</button>
  </div>
</div>

<script src="data-works.js?v=2"></script>
<script src="data-authors.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
